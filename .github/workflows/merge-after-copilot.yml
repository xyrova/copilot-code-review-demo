name: Merge after Copilot review

on:
  repository_dispatch:
    types:
      - copilot_review_passed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Comment approval
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "Approved — Copilot review passed."

      - name: Merge PR and delete branch
        env:
          GH_TOKEN: ${{ secrets.MERGE_PAT }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            --delete-branch