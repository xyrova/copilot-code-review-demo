name: Merge after Copilot review

on:
  repository_dispatch:
    types:
      - copilot_review_passed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: copilot-merge-pr-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.REVIEWER_PAT }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      REVIEWED_SHA: ${{ github.event.client_payload.head_sha }}
      REPO: ${{ github.repository }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::client_payload.pr_number is missing or invalid: '$PR_NUMBER'"
            exit 1
          fi
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::client_payload.head_sha is missing or invalid: '$REVIEWED_SHA'"
            exit 1
          fi

      - name: Validate PR state
        run: |
          set -euo pipefail
          pr_json=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,isDraft,headRefOid)
          state=$(echo "$pr_json" | jq -r '.state')
          is_draft=$(echo "$pr_json" | jq -r '.isDraft')
          current_sha=$(echo "$pr_json" | jq -r '.headRefOid')

          if [[ "$state" != "OPEN" ]]; then
            echo "::error::PR #$PR_NUMBER is not open (state: $state)"
            exit 1
          fi
          if [[ "$is_draft" == "true" ]]; then
            echo "::error::PR #$PR_NUMBER is a draft and cannot be merged"
            exit 1
          fi
          if [[ "$current_sha" != "$REVIEWED_SHA" ]]; then
            echo "::error::PR head ($current_sha) differs from reviewed SHA ($REVIEWED_SHA)"
            exit 1
          fi

      - name: Validate status checks
        run: |
          set -euo pipefail
          checks_json=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json state,name 2>/dev/null || echo "[]")
          not_passed=$(echo "$checks_json" | jq -r '[.[] | select(.state != "SUCCESS" and .state != "SKIPPED")] | length')

          if [[ "$not_passed" -gt 0 ]]; then
            echo "::error::PR #$PR_NUMBER has $not_passed non-passing check(s)"
            echo "$checks_json" | jq -r '.[] | select(.state != "SUCCESS" and .state != "SKIPPED") | "  - \(.name): \(.state)"'
            exit 1
          fi

      - name: Approve PR
        run: |
          set -euo pipefail
          gh pr review "$PR_NUMBER" \
            --repo "$REPO" \
            --approve \
            --body $'/lgtm\n\n/approve'

      - name: Merge PR and delete branch
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --match-head-commit "$REVIEWED_SHA" \
            --delete-branch