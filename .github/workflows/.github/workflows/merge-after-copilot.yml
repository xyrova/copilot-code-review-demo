name: Merge after Copilot review

on:
  repository_dispatch:
    types:
      - copilot_review_passed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --squash \
            --auto
